# Progressive Life Ontology
ontology:
  world:
    entities: [episode, voice, event, decision, relation, view, actor, interface, provider, artifact]
  episode:
    type: fragment
    canonical_source: voice
  voice:
    type: artifact
  event:
    type: history
  decision:
    type: interpretation
    producer: Jev
  relation:
    type: edge
  view:
    type: projection
  actor:
    type: subject
  interface:
    type: boundary
  provider:
    type: infrastructure
  artifact:
    type: binary
