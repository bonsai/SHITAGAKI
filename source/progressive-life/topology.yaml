# Progressive Life Topology
topology:
  flow:
    canonical: [voice, episode, event, decision, relation, view]
    operational: [actor, action, event, decision, action, event]
  relationships:
    - {from: actor, to: voice, type: records}
    - {from: voice, to: episode, type: derives}
    - {from: episode, to: episode, type: relates}
    - {from: decision, to: relation, type: proposes}
    - {from: actor, to: relation, type: confirms}
    - {from: relation, to: view, type: projects}
  world_flow: [history, latest, now, action]
